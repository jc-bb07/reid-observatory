<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Now / Never — IoM Observatory</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6; --series-2: #008300; --series-3: #e87ba4; --series-4: #eda100;
    --series-5: #1baf7a; --series-6: #eb6834; --series-7: #4a3aa7; --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19; --page: #0d0d0d; --text-primary: #ffffff; --text-secondary: #c3c2b7;
      --text-muted: #898781; --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #008300; --series-3: #d55181; --series-4: #c98500;
      --series-5: #199e70; --series-6: #d95926; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d; --text-primary: #ffffff; --text-secondary: #c3c2b7;
    --text-muted: #898781; --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #008300; --series-3: #d55181; --series-4: #c98500;
    --series-5: #199e70; --series-6: #d95926; --series-7: #9085e9; --series-8: #e66767;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--page); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text-primary);
    max-width: 460px; margin: 0 auto; min-height: 100vh;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .theme-toggle {
    position: fixed; top: 10px; right: 10px; font-size: 11px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 5px 10px; z-index: 20; opacity: 0.85;
  }

  header.top {
    position: sticky; top: 0; z-index: 10; background: var(--page);
    padding: calc(14px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header.top h1 {
    font-size: 15px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase;
    color: var(--text-muted); margin: 0 0 10px; text-align: center;
  }

  .segmented {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 4px;
  }
  .seg-btn {
    font: inherit; font-size: 13.5px; font-weight: 700; padding: 9px 4px; border: none; border-radius: 9px;
    background: transparent; color: var(--text-secondary); cursor: pointer; text-align: center;
  }
  .seg-btn.active { background: var(--text-primary); color: var(--surface-1); }
  .seg-btn.away { color: var(--series-1); }

  main { padding: 14px 16px 6px; }
  .subhead { font-size: 12.5px; color: var(--text-muted); text-align: center; margin: 2px 0 16px; line-height: 1.4; }

  .stack { display: flex; flex-direction: column; gap: 12px; }

  .tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 18px 14px; position: relative; cursor: pointer;
  }
  .tile .num {
    font-size: 46px; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums; color: var(--accent, var(--series-1));
  }
  .tile .cap { font-size: 14.5px; color: var(--text-primary); line-height: 1.35; margin-top: 6px; font-weight: 500; }
  .tile .spark-row { margin: 8px 0 -2px; }
  .tile .chevron {
    position: absolute; top: 16px; right: 16px; font-size: 11px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 8px; width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
  }
  .tile.open .chevron { transform: rotate(45deg); }
  .tile .detail {
    max-height: 0; overflow: hidden; transition: max-height 0.2s ease;
    font-size: 12px; color: var(--text-muted); line-height: 1.5;
  }
  .tile.open .detail { max-height: 120px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .tile .detail a { color: var(--accent, var(--series-1)); font-weight: 600; }

  .tab-panel { display: none; }
  .tab-panel.visible { display: block; }

  footer.away-note {
    text-align: center; font-size: 11.5px; color: var(--text-muted); padding: 18px 16px 0;
  }
</style>
</head>
<body>
<div class="theme-toggle" id="themeToggle">◐</div>

<header class="top">
  <h1>Isle of Man Observatory</h1>
  <div class="segmented">
    <button class="seg-btn active" data-tab="now">Now</button>
    <button class="seg-btn" data-tab="never">Never</button>
    <button class="seg-btn away" id="seriousBtn">The serious stuff →</button>
  </div>
</header>

<main>
  <div class="subhead" id="subhead">Currently weird.</div>

  <div class="tab-panel visible" id="panel-now"><div class="stack" id="stack-now"></div></div>
  <div class="tab-panel" id="panel-never"><div class="stack" id="stack-never"></div></div>
</main>

<script>
const ACCENT = { now: 'var(--series-1)', never: 'var(--series-7)' };

const NOW = [
  { num: "140", cap: "average people held in a Douglas prison built for 92, 2024.",
    detail: "Dept. of Home Affairs blames longer sentences for drug offences. — In Numbers 2025" },
  { num: "£2.1m", cap: "value of drugs seized in 2023/24 — 12× what it was a decade ago.",
    detail: "Mostly herbal cannabis by weight. — In Numbers 2025", spark: "drugs" },
  { num: "8", cap: "total “units” of ecstasy seized on the whole Island, 2022/23. Eight.",
    detail: "Same year: 88kg of herbal cannabis. — In Numbers 2025" },
  { num: "−334", cap: "more people died than were born on the Island, 2024/25 — first time on record.",
    detail: "563 births, 897 deaths. — In Numbers 2025" },
  { num: "24", cap: "private jets struck off the Isle of Man aircraft register in 2022.",
    detail: "A directive to purge anything tied to Russia or Belarus, post-invasion. — In Numbers 2025" },
  { num: "2,000+", cap: "people who can now speak Manx Gaelic. Zero, officially, in 1974.",
    detail: "Manx-medium schooling began in 2001. — 2021 Census" },
  { num: "2×", cap: "the government called it “the warmest year on record” — 2022, then 2023 again.",
    detail: "Ronaldsway met records, in the government's own words. — In Numbers 2023 & 2024" },
  { num: "68 : 560", cap: "burglaries vs. violent crimes recorded in 2024 — almost exactly flipped since 1996.",
    detail: "213 violent crimes in 1996, 544 burglaries. — Economic Digests &amp; In Numbers", spark: "crime" }
];

const NEVER = [
  { num: "0", cap: "strikes recorded — in any industry, every year, 1996–2005. Not one.",
    detail: "Every sector, every year, logged zero. — Economic Digest 2006" },
  { num: "−18%", cap: "population crash, 1921 → 1931. Nobody wrote down why.",
    detail: "60,284 down to 49,308. Presumed: emigration. — Economic Digest 2006" },
  { num: "6,628→634", cap: "the Island's entire pig population, 1998 to 2004. A 90% wipeout.",
    detail: "Itemised down to “boars used for service.” — Economic Digest 2006", spark: "pigs" },
  { num: "40,081", cap: "the Island's whole population, first census, 1821.",
    detail: "84,069 by 2021 — exactly double, 200 years later. — Economic Digest 2006", spark: "population" },
  { num: "2", cap: "times the same clothes line got robbed of “panties,” 1958–1960. Bound over, blamed an “irresistible impulse.”",
    detail: "Isle of Man Times, 17 Jun 1960, p.8 — <a href=\"https://www.imuseum.im/Olive/APA/IsleofMan/?action=search&text=clothes%20line\" target=\"_blank\">via iMuseum ↗</a>" },
  { num: "£7", cap: "total fine for John Caleb Creer, “drunk in charge of a bicycle,” 1958.",
    detail: "£2 for the bicycle, £5 for drunk &amp; disorderly. Three papers ran the same headline that week. — Mona's Herald, 5 Aug 1958 — <a href=\"https://www.imuseum.im/Olive/APA/IsleofMan/?action=search&text=drunk%20in%20charge%20of%20a%20bicycle\" target=\"_blank\">via iMuseum ↗</a>" },
  { num: "1", cap: "escaped circus monkey, Rosita, prompting an actual police warning. Laxey, 1958.",
    detail: "Recaptured by staff the next day. — Mona's Herald, 1–8 Jul 1958 — <a href=\"https://www.imuseum.im/Olive/APA/IsleofMan/?action=search&text=escaped%20monkey\" target=\"_blank\">via iMuseum ↗</a>" },
  { num: "10 yrs", cap: "after Gef the Talking Mongoose vanished, someone caught “an animal… strikingly” similar. Again.",
    detail: "The original 1930s case made front pages as far as America. — Isle of Man Examiner, 21 Feb 1947 — <a href=\"https://www.imuseum.im/Olive/APA/IsleofMan/?action=search&text=talking%20mongoose\" target=\"_blank\">via iMuseum ↗</a>" },
  { num: "23.9m", cap: "letters received on the Island in one year, 2005 — before smartphones existed.",
    detail: "About 306 per resident that year. — Economic Digest 2006" }
];

function sparkSVG(kind, color) {
  const datasets = {
    population: [40081,41000,47975,52387,54042,53558,55608,54752,52016,60284,49308,55253,48133,54581,66101,71267,78266,84069],
    crime: [213,388,468,587,692,540,358,457,592,622,712,560],
    pigs: [4687,6271,6628,6006,4227,3053,3178,760,817,634],
    drugs: [171515,308332,749742,973036,1025610,983631,926664,612955,1970571,2095432]
  };
  const points = datasets[kind];
  if (!points) return "";
  const w = 300, h = 40, pad = 3;
  const min = Math.min(...points), max = Math.max(...points);
  const x = i => pad + (i / (points.length - 1)) * (w - pad * 2);
  const y = v => h - pad - ((v - min) / (max - min || 1)) * (h - pad * 2);
  const path = points.map((v, i) => `${x(i)},${y(v)}`).join(" L ");
  const lastX = x(points.length - 1), lastY = y(points[points.length - 1]);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible;display:block">
    <path d="M ${path}" fill="none" style="stroke:${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity="0.9"/>
    <circle cx="${lastX}" cy="${lastY}" r="3.5" style="fill:${color}" />
  </svg>`;
}

// Colors are passed through as CSS var() references (not resolved to a frozen rgb string) so
// both the tile accent and the inline sparkline stroke keep tracking light/dark theme switches.
function renderStack(containerId, items, tabKey) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  const accentVar = ACCENT[tabKey];
  items.forEach((it) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.setProperty('--accent', accentVar);
    tile.innerHTML = `
      <div class="chevron">+</div>
      <div class="num">${it.num}</div>
      <div class="cap">${it.cap}</div>
      ${it.spark ? `<div class="spark-row">${sparkSVG(it.spark, accentVar)}</div>` : ""}
      <div class="detail">${it.detail}</div>
    `;
    tile.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') return;
      tile.classList.toggle('open');
    });
    el.appendChild(tile);
  });
}

function renderAll() {
  renderStack('stack-now', NOW, 'now');
  renderStack('stack-never', NEVER, 'never');
}

renderAll();

// tab switching
const segBtns = document.querySelectorAll('.seg-btn[data-tab]');
const subhead = document.getElementById('subhead');
const SUBHEADS = { now: "Currently weird.", never: "Historical oddities. Filed and forgotten, until now." };
segBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    segBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('visible'));
    document.getElementById('panel-' + tab).classList.add('visible');
    subhead.textContent = SUBHEADS[tab];
  });
});

document.getElementById('seriousBtn').addEventListener('click', () => {
  window.location.href = 'iom-fun-facts-timelines.html';
});

document.getElementById('themeToggle').addEventListener('click', () => {
  const next = (document.documentElement.getAttribute('data-theme') === 'dark') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
});
</script>
</body>
</html>
