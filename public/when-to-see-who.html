<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>When to See Who · Isle of Man · Coalfinch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

:root {
  --bg:#F5F0E8; --surface:#FFFFFF; --surface2:#EBF4F4; --surface3:#D5E9E9;
  --border:rgba(0,0,0,0.09); --border-hi:rgba(0,0,0,0.17);
  --text:#152222; --muted:#4a6e6e; --muted2:#6b8c8c;
  --teal:#009BA5; --teal-d:#007880;
  --red:#c0392b;   --red-bg:rgba(192,57,43,0.07);   --red-bdr:rgba(192,57,43,0.20);
  --amber:#b45309; --amber-bg:rgba(180,83,9,0.07);   --amber-bdr:rgba(180,83,9,0.20);
  --green:#047857; --green-bg:rgba(4,120,87,0.07);   --green-bdr:rgba(4,120,87,0.20);
  --blue:#1d4ed8;  --blue-bg:rgba(29,78,216,0.07);   --blue-bdr:rgba(29,78,216,0.20);
  --purple:#6d28d9;--purple-bg:rgba(109,40,217,0.07);--purple-bdr:rgba(109,40,217,0.20);
  --teal-bg:rgba(0,155,165,0.07); --teal-bdr:rgba(0,155,165,0.22);
  --pink:#be185d;  --pink-bg:rgba(190,24,93,0.07);   --pink-bdr:rgba(190,24,93,0.20);
  --fs-hero:13px; --fs-chip:13px; --fs-body:13px; --fs-lbl:9px; --fs-big:26px; --fs-sub:11px;
}
html.dark {
  --bg:#080d1a; --surface:#0f1729; --surface2:#141f33; --surface3:#1a2740;
  --border:rgba(255,255,255,0.07); --border-hi:rgba(255,255,255,0.14);
  --text:#e2e8f0; --muted:#64748b; --muted2:#475569;
  --teal:#2dd4bf;
  --red:#f87171;   --red-bg:rgba(248,113,113,0.1);   --red-bdr:rgba(248,113,113,0.25);
  --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.1);  --amber-bdr:rgba(251,191,36,0.25);
  --green:#34d399; --green-bg:rgba(52,211,153,0.1);  --green-bdr:rgba(52,211,153,0.25);
  --blue:#60a5fa;  --blue-bg:rgba(96,165,250,0.1);   --blue-bdr:rgba(96,165,250,0.25);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,0.1);--purple-bdr:rgba(167,139,250,0.25);
  --teal-bg:rgba(45,212,191,0.1); --teal-bdr:rgba(45,212,191,0.25);
  --pink:#f472b6;  --pink-bg:rgba(244,114,182,0.1);  --pink-bdr:rgba(244,114,182,0.25);
}
html.large { --fs-hero:15px; --fs-chip:15px; --fs-body:15px; --fs-lbl:11px; --fs-big:30px; --fs-sub:13px; }

html,body { height:100%; height:100dvh; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
.app { display:flex; flex-direction:column; height:100%; height:100dvh; max-width:480px; margin:0 auto; }
.header { padding:14px 16px 0; flex-shrink:0; }
.header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.hero h1 { font-size:var(--fs-big); font-weight:900; line-height:1.05; letter-spacing:-0.025em; margin-bottom:3px; }
.hero p { font-size:var(--fs-hero); color:var(--muted); }
.controls { display:flex; gap:6px; }
.ctrl-btn { background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:11px; padding:4px 9px; cursor:pointer; font-family:inherit; }
.ctrl-btn.active { border-color:var(--border-hi); color:var(--text); }

/* ── GRID ── */
.grid-wrap { flex:1; overflow-y:auto; padding:12px 16px 16px; -webkit-overflow-scrolling:touch; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* ── CHIPS ── */
.chip { background:var(--surface); border:1.5px solid var(--border); border-radius:14px; padding:13px 12px 11px; cursor:pointer; text-align:left; font-family:inherit; transition:border-color .15s,background .15s,transform .08s; -webkit-tap-highlight-color:transparent; user-select:none; position:relative; display:flex; flex-direction:column; }
.chip:active { transform:scale(0.97); }
.chip.active { border-color:var(--cc); background:var(--cb); }
.chip.c-red    { --cc:var(--red);    --cb:var(--red-bg);    }
.chip.c-amber  { --cc:var(--amber);  --cb:var(--amber-bg);  }
.chip.c-green  { --cc:var(--green);  --cb:var(--green-bg);  }
.chip.c-teal   { --cc:var(--teal);   --cb:var(--teal-bg);   }
.chip.c-blue   { --cc:var(--blue);   --cb:var(--blue-bg);   }
.chip.c-purple { --cc:var(--purple); --cb:var(--purple-bg); }
.chip.c-pink   { --cc:var(--pink);   --cb:var(--pink-bg);   }
.chip-act { border-color:var(--red-bdr); background:var(--red-bg); }
.chip-act.active { border-color:var(--red); }
.chip-full { grid-column:1/-1; flex-direction:row; align-items:flex-start; gap:12px; }
.chip-full .chip-icon { font-size:22px; margin-bottom:0; margin-top:2px; flex-shrink:0; }
.chip-full .chip-body { flex:1; }
.chip-full .chip-stats { margin-top:6px; }
.chip-icon  { font-size:19px; margin-bottom:5px; line-height:1; }
.chip-label { font-size:var(--fs-chip); font-weight:800; color:var(--text); line-height:1.2; margin-bottom:3px; }
.chip-sub   { font-size:var(--fs-sub); color:var(--muted); line-height:1.3; flex:1; }
.chip-sub .clin { color:var(--green); font-weight:700; }
.chip-stats { display:flex; gap:0; margin-top:8px; background:var(--surface2); border-radius:8px; overflow:hidden; border:1px solid var(--border); }
.chip-stats-3 { display:grid; grid-template-columns:1fr 1fr 1fr; margin-top:8px; background:var(--surface2); border-radius:8px; overflow:hidden; border:1px solid var(--border); }
.chip-stat  { flex:1; display:flex; flex-direction:column; align-items:center; padding:5px 4px; gap:1px; }
.chip-stat+.chip-stat { border-left:1px solid var(--border); }
.chip-stats-3 .chip-stat { border-left:1px solid var(--border); border-bottom:1px solid var(--border); }
.chip-stats-3 .chip-stat:nth-child(3n+1) { border-left:none; }
.chip-stats-3 .chip-stat:nth-child(n+4) { border-bottom:none; }
.cs-icon { font-size:12px; line-height:1; }
.cs-val  { font-size:12px; font-weight:900; color:var(--text); line-height:1; }
.cs-val.cvg { color:var(--green); }
.cs-val.cva { color:var(--amber); }
.cs-val.cvr { color:var(--red); }
.cs-val.cvb { font-size:16px; }
.cs-lbl  { font-size:7.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted2); line-height:1; text-align:center; }
.chip-live { margin-top:7px; padding:5px 8px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; gap:6px; }
.live-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; animation:pulse 2s infinite; }
.live-dot.green { background:var(--green); }
.live-dot.amber { background:var(--amber); }
.live-dot.grey  { background:var(--muted2); animation:none; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live-txt { font-size:11px; font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip-badge { position:absolute; top:9px; right:9px; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:4px; }
.b-open   { background:var(--green-bg); border:1px solid var(--green-bdr); color:var(--green); }
.b-active { background:var(--amber-bg); border:1px solid var(--amber-bdr); color:var(--amber); }

/* ── PANEL ── */
.panel { display:none; background:var(--surface); border:1.5px solid var(--border-hi); border-radius:16px; padding:15px; grid-column:1/-1; animation:slideIn .17s ease-out; }
.panel.show { display:block; }
@keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.ub { display:inline-flex; align-items:center; gap:5px; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; padding:3px 9px; border-radius:20px; margin-bottom:9px; }
.ub-red    { background:var(--red-bg);    border:1px solid var(--red-bdr);    color:var(--red);    }
.ub-amber  { background:var(--amber-bg);  border:1px solid var(--amber-bdr);  color:var(--amber);  }
.ub-green  { background:var(--green-bg);  border:1px solid var(--green-bdr);  color:var(--green);  }
.ub-teal   { background:var(--teal-bg);   border:1px solid var(--teal-bdr);   color:var(--teal);   }
.ub-purple { background:var(--purple-bg); border:1px solid var(--purple-bdr); color:var(--purple); }
.ub-pink   { background:var(--pink-bg);   border:1px solid var(--pink-bdr);   color:var(--pink);   }
.p-service { font-size:19px; font-weight:900; letter-spacing:-.015em; margin-bottom:4px; line-height:1.1; }
.p-why { font-size:var(--fs-body); color:var(--muted); line-height:1.5; margin-bottom:12px; }
.dbox { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-bottom:12px; }
.dr { display:flex; align-items:flex-start; gap:7px; padding:3px 0; }
.dr+.dr { border-top:1px solid var(--border); margin-top:4px; padding-top:6px; }
.di { font-size:12px; flex-shrink:0; margin-top:2px; }
.dk { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted2); min-width:52px; flex-shrink:0; margin-top:3px; }
.dv { font-size:var(--fs-body); color:var(--text); line-height:1.4; }
.dv strong{font-weight:700;} .dv em{color:var(--muted);font-style:normal;font-size:11px;} .dv a{color:inherit;}
.btns { display:flex; gap:7px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:11px 14px; border-radius:10px; font-size:var(--fs-body); font-weight:700; font-family:inherit; cursor:pointer; border:none; text-decoration:none; flex:1; min-width:88px; transition:opacity .15s,transform .08s; -webkit-tap-highlight-color:transparent; }
.btn:active { transform:scale(0.97); opacity:.82; }
.b2  { background:var(--surface2); border:1.5px solid var(--border-hi); color:var(--text); }
.b-r { background:var(--red);    color:#fff; }
.b-a { background:var(--amber);  color:#2a1400; }
.b-g { background:var(--green);  color:#fff; }
.b-t { background:var(--teal);   color:#fff; }
.b-b { background:var(--blue);   color:#fff; }
.b-p { background:var(--purple); color:#fff; }
.b-k { background:var(--pink);   color:#fff; }

/* ══ SAFE FRAMEWORK ══ */
.framework-hdr { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:var(--muted2); margin-bottom:10px; }
.fw-row { display:flex; gap:10px; align-items:flex-start; margin-bottom:9px; }
.fw-letter { flex-shrink:0; width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:#fff; margin-top:1px; }
.fw-s .fw-letter { background:var(--red); }
.fw-a .fw-letter { background:#dc2626; }
.fw-f .fw-letter { background:#b91c1c; }
.fw-e .fw-letter { background:#991b1b; }
.fw-h .fw-letter { background:var(--green); }
.fw-ev .fw-letter { background:#059669; }
.fw-l .fw-letter { background:#047857; }
.fw-p .fw-letter { background:#065f46; }
.fw-field { flex:1; min-width:0; }
.fw-lbl { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted2); margin-bottom:4px; }
.fw-inp { width:100%; background:var(--surface2); border:1px solid var(--border-hi); border-radius:7px; color:var(--text); font-family:inherit; font-size:13px; padding:7px 10px; outline:none; transition:border-color .15s; }
.fw-inp:focus { border-color:var(--red-bdr); }
.fw-inp-g { border-color:var(--border-hi); }
.fw-inp-g:focus { border-color:var(--green-bdr) !important; }
.fw-loc-box { background:var(--red-bg); border:1.5px solid var(--red-bdr); border-radius:7px; padding:8px 10px; }
.fw-loc-w3w { font-size:14px; font-weight:900; line-height:1.2; margin-bottom:3px; }
.fw-loc-slash { color:var(--teal); }
.fw-loc-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.fw-loc-coord { font-size:10px; color:var(--muted); }
.fw-loc-badge { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:4px; }
.fw-verified   { background:var(--green-bg); border:1px solid var(--green-bdr); color:var(--green); }
.fw-unverified { background:var(--amber-bg); border:1px solid var(--amber-bdr); color:var(--amber); }
.fw-no-loc     { background:var(--red-bg);   border:1px solid var(--red-bdr);   color:var(--red); }
.fw-get-loc { display:inline-flex; align-items:center; gap:5px; padding:7px 11px; border-radius:7px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--surface); border:1px solid var(--border-hi); color:var(--text); margin-top:4px; }
.fw-checks { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
.fw-check { padding:4px 9px; border-radius:5px; font-size:11px; font-weight:700; border:1px solid var(--border-hi); background:var(--surface); color:var(--muted); cursor:pointer; transition:all .12s; user-select:none; -webkit-tap-highlight-color:transparent; }
.fw-check.on { background:var(--red-bg); border-color:var(--red-bdr); color:var(--red); }
.fw-inp-extra { width:100%; background:var(--surface2); border:1px solid var(--border-hi); border-radius:7px; color:var(--text); font-family:inherit; font-size:12px; padding:6px 10px; outline:none; margin-top:5px; }
.fw-inp-extra:focus { border-color:var(--red-bdr); }

/* Script card — high contrast, easy to read aloud */
.script-card { background:var(--text); color:var(--bg); border-radius:12px; padding:14px 15px; margin-bottom:12px; }
.script-card-lbl { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; opacity:.5; margin-bottom:7px; }
.script-card-txt { font-size:14px; font-weight:700; line-height:1.55; }
html.dark .script-card { background:var(--surface3); color:var(--text); }

.script-card-g { background:var(--green); color:#fff; border-radius:12px; padding:14px 15px; margin-bottom:12px; }
.script-card-g .script-card-lbl { opacity:.7; }
.script-card-g .script-card-txt { font-size:14px; font-weight:700; line-height:1.55; }

/* Help pref buttons */
.pref-row { display:flex; gap:6px; margin-top:4px; }
.pref-btn { flex:1; padding:7px 10px; border-radius:7px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; border:1.5px solid var(--border-hi); background:var(--surface); color:var(--muted); transition:all .12s; }
.pref-btn.on { background:var(--green-bg); border-color:var(--green-bdr); color:var(--green); }

/* ── PICKERS ── */
.picker-wrap { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:12px; }
.picker-title { font-size:9px; font-weight:800; color:var(--muted2); text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; }
.picker-search { width:100%; background:var(--surface); border:1px solid var(--border-hi); border-radius:7px; color:var(--text); font-family:inherit; font-size:var(--fs-body); padding:8px 10px; margin-bottom:7px; outline:none; }
.picker-search:focus { border-color:var(--teal-bdr); }
.picker-list { max-height:155px; overflow-y:auto; }
.picker-row { padding:8px 8px; border-radius:7px; cursor:pointer; transition:background .12s; }
.picker-row:hover,.picker-row:active { background:var(--surface3); }
.picker-name { font-size:var(--fs-body); font-weight:700; }
.picker-area { font-size:11px; color:var(--muted); }
.picker-tel  { font-size:11px; color:var(--teal); font-weight:600; }

/* ── PHARMACY LIST ── */
.ph-list { background:var(--surface2); border:1px solid var(--border); border-radius:10px; margin-bottom:12px; overflow:hidden; }
.ph-row { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--border); }
.ph-row:last-child { border-bottom:none; }
.ph-row.ph-hi { background:var(--green-bg); }
.ph-dist { font-size:11px; font-weight:700; color:var(--muted); min-width:34px; text-align:center; flex-shrink:0; }
.ph-info { flex:1; min-width:0; }
.ph-name { font-size:var(--fs-body); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ph-area { font-size:10px; color:var(--muted); }
.ph-badges { display:flex; gap:3px; margin-top:2px; flex-wrap:wrap; }
.ph-badge { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:1px 5px; border-radius:3px; }
.pb-open { background:var(--green-bg); color:var(--green); border:1px solid var(--green-bdr); }
.pb-fav  { background:var(--teal-bg);  color:var(--teal);  border:1px solid var(--teal-bdr); }
.ph-actions { display:flex; gap:4px; flex-shrink:0; }
.ph-call { background:var(--teal-bg); border:1px solid var(--teal-bdr); color:var(--teal); padding:5px 8px; border-radius:7px; font-size:11px; font-weight:700; text-decoration:none; }
.ph-star { background:var(--surface); border:1px solid var(--border-hi); color:var(--muted); padding:5px 7px; border-radius:7px; font-size:11px; cursor:pointer; font-family:inherit; }
.ph-star.active { background:var(--teal-bg); border-color:var(--teal-bdr); color:var(--teal); }

/* ── SAVED CARDS ── */
.saved-card { border-radius:12px; padding:12px 14px; margin-bottom:12px; }
.sc-teal  { background:var(--teal-bg);  border:1.5px solid var(--teal-bdr);  }
.sc-pink  { background:var(--pink-bg);  border:1.5px solid var(--pink-bdr);  }
.sc-amber { background:var(--amber-bg); border:1.5px solid var(--amber-bdr); }
.saved-lbl  { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; margin-bottom:3px; }
.sc-teal  .saved-lbl { color:var(--teal);  }
.sc-pink  .saved-lbl { color:var(--pink);  }
.sc-amber .saved-lbl { color:var(--amber); }
.saved-name { font-size:16px; font-weight:900; letter-spacing:-.01em; margin-bottom:2px; }
.saved-sub  { font-size:11px; color:var(--muted); margin-bottom:9px; }

/* ── MH TABLE ── */
.mh-table { background:var(--surface2); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:12px; }
.mh-grp { background:var(--surface3); padding:4px 12px; border-bottom:1px solid var(--border); }
.mh-grp-lbl { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); }
.mh-tr { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--border); }
.mh-tr:last-child { border-bottom:none; }
.mh-tr-info { flex:1; min-width:0; }
.mh-tr-name { font-size:12px; font-weight:800; line-height:1.2; }
.mh-tr-sub  { font-size:10px; color:var(--muted); margin-top:1px; }
.mh-tr-wait { display:flex; flex-direction:column; gap:3px; align-items:flex-end; flex-shrink:0; }
.mh-tr-acts { display:flex; gap:4px; flex-shrink:0; }
.mh-mini { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:8px; font-size:13px; text-decoration:none; background:var(--surface); border:1px solid var(--border-hi); color:var(--text); -webkit-tap-highlight-color:transparent; cursor:pointer; font-family:inherit; }
.mh-mini.mh-r { background:var(--red);    border-color:var(--red);    color:#fff; }
.mh-mini.mh-p { background:var(--purple); border-color:var(--purple); color:#fff; }
.wt { display:inline-block; font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 6px; border-radius:3px; white-space:nowrap; }
.wt-g { background:var(--green-bg); color:var(--green); border:1px solid var(--green-bdr); }
.wt-a { background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-bdr); }
.wt-r { background:var(--red-bg);   color:var(--red);   border:1px solid var(--red-bdr); }
.wt-m { background:rgba(0,0,0,.05); color:var(--muted); border:1px solid var(--border); }

/* ── FAST BOXES ── */
.fast-box { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:12px; }
.fast-item { background:var(--red-bg); border:1.5px solid var(--red-bdr); border-radius:10px; padding:10px 10px 8px; }
.fast-letter { font-size:20px; font-weight:900; color:var(--red); line-height:1; }

function hav(a1,o1,a2,o2){var R=6371,dA=(a2-a1)*Math.PI/180,dO=(o2-o1)*Math.PI/180,a=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dO/2)*Math.sin(dO/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

function fetchW3W(lat,lng,cb){fetch('https://api.what3words.com/v3/convert-to-3wa?coordinates='+lat+','+lng+'&api_key='+W3W).then(function(r){return r.json();}).then(function(d){cb(d.words||null);}).catch(function(){cb(null);});}
function getLocation(cb){if(cachedLoc){cb(cachedLoc);return;}if(!navigator.geolocation){cb(null);return;}navigator.geolocation.getCurrentPosition(function(pos){var lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy;fetchW3W(lat,lng,function(words){cachedLoc={lat:lat,lng:lng,acc:acc,words:words};cb(cachedLoc);});},function(){cb(null);},{timeout:8000,maximumAge:60000,enableHighAccuracy:true});}

function locBadge(acc){
  if(acc===undefined||acc===null)return'<span class="fw-loc-badge fw-no-loc">Location unknown</span>';
  if(acc<=20)return'<span class="fw-loc-badge fw-verified">✓ Verified · ±'+Math.round(acc)+'m</span>';
  if(acc<=100)return'<span class="fw-loc-badge fw-unverified">~ Unverified · ±'+Math.round(acc)+'m</span>';
  return'<span class="fw-loc-badge fw-unverified">Approximate · ±'+Math.round(acc)+'m</span>';
}

// ══ PANEL RENDERER ══
var cur=null,panelEl=null;
function sel(id){
  var grid=document.getElementById('grid');
  if(panelEl){panelEl.remove();panelEl=null;}
  grid.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active');});
  if(cur===id){cur=null;return;}
  cur=id;
  var chip=grid.querySelector('[data-id="'+id+'"]');if(chip)chip.classList.add('active');
  panelEl=document.createElement('div');panelEl.className='panel show';
  panelEl.innerHTML=(ANSWERS[id]||function(){return'';})();
  var chips=Array.from(grid.querySelectorAll('.chip')),idx=chips.indexOf(chip);
  if(chip&&chip.classList.contains('chip-full')){grid.appendChild(panelEl);}
  else{var pair=chips[idx%2===0?idx+1:idx];if(pair&&pair.nextSibling)grid.insertBefore(panelEl,pair.nextSibling);else grid.appendChild(panelEl);}
  // Post-render init
  if(id==='stroke'||id==='emergency'){
    if(cachedLoc){renderSafeLocBox(cachedLoc);}
    else{getLocation(function(loc){renderSafeLocBox(loc);});}
    genSafeSummary();
    setTimeout(function(){var s=document.getElementById('safeS');if(s&&!s.value)s.focus();},150);
  }
  if(id==='doctor'&&!getSavedGP()){var box=document.getElementById('gpBox');if(box)setTimeout(function(){box.focus();},120);}
  if(id==='dental'&&!getSavedDentist()){var db=document.getElementById('dentBox');if(db)setTimeout(function(){db.focus();},120);}
  if(id==='ed'&&cachedLoc)updateEdTravel(cachedLoc.lat,cachedLoc.lng);
  setTimeout(function(){if(panelEl)panelEl.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}
