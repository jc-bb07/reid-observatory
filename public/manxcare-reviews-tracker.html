<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Manx Care — Reviews &amp; Accountability Tracker</title>
<style>
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --surface2: #F8F9FA;
  --border: #E1E4E8;
  --text: #1A1D23;
  --text2: #5A6272;
  --text3: #8C93A0;

  --iom: #1B6CA8;
  --tynwald: #6B21A8;
  --green: #16A34A;
  --amber: #D97706;
  --red: #DC2626;
  --teal: #0D9488;
  --slate: #64748B;

  /* action status colours */
  --st-identified: #2563EB;
  --st-accepted: #0D9488;
  --st-in-progress: #D97706;
  --st-completed: #16A34A;
  --st-rejected: #DC2626;
  --st-partial: #EA580C;
  --st-unknown: #94A3B8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100dvh;
}

/* ── Layout ── */
.page { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }

/* ── Header ── */
.hdr { margin-bottom: 24px; }
.hdr h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.hdr .sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
.hdr-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

.stat-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px;
  font-size: 12px; color: var(--text2);
  cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.stat-pill:hover { border-color: var(--iom); box-shadow: 0 0 0 2px #1B6CA820; }
.stat-pill .n { font-size: 20px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-pill.active { border-color: var(--iom); background: #EFF6FF; }
.stat-pill.active .n { color: var(--iom); }
.stat-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ── Filter bar ── */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.filter-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
.filter-btn {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--text2);
  cursor: pointer; transition: all .15s;
}
.filter-btn:hover { border-color: var(--iom); color: var(--iom); }
.filter-btn.on { background: var(--iom); border-color: var(--iom); color: #fff; }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

/* ── Review cards ── */
.reviews { display: flex; flex-direction: column; gap: 14px; }

.rcard {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
  transition: box-shadow .15s;
}
.rcard:hover { box-shadow: 0 2px 12px #0001; }
.rcard.hidden { display: none; }

.rcard-hdr {
  padding: 16px 18px 14px;
  cursor: pointer;
  user-select: none;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
  align-items: start;
}
.rcard-hdr:hover { background: var(--surface2); }

.rcard-title-row { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.rcard-title { font-size: 15px; font-weight: 700; }
.rcard-year { font-size: 12px; color: var(--text3); margin-top: 2px; }

.rcard-meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.rcard-meta span::before { content: '·'; margin-right: 12px; color: var(--border); }
.rcard-meta span:first-child::before { display: none; }

.rcard-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }

.pub-badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 6px; padding: 3px 9px; font-size: 11px; font-weight: 600; letter-spacing: .2px;
}
.pub-badge.yes { background: #DCFCE7; color: #15803D; }
.pub-badge.no  { background: #FEF2F2; color: #B91C1C; }
.pub-badge.unclear { background: #FFF7ED; color: #C2410C; }

.domain-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.dtag {
  border-radius: 4px; padding: 2px 7px; font-size: 10px; font-weight: 600;
  background: #EFF6FF; color: var(--iom); border: 1px solid #BFDBFE;
}

.chevron { font-size: 14px; color: var(--text3); transition: transform .2s; margin-top: 2px; }
.rcard.open .chevron { transform: rotate(180deg); }

/* ── Summary ── */
.rcard-summary {
  padding: 0 18px 14px;
  font-size: 13px; color: var(--text2); line-height: 1.6;
  display: none;
}
.rcard.open .rcard-summary { display: block; }

/* ── Tabs ── */
.rcard-tabs {
  border-top: 1px solid var(--border);
  display: none;
}
.rcard.open .rcard-tabs { display: block; }

.tab-bar { display: flex; border-bottom: 1px solid var(--border); }
.tab-btn {
  padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--text2);
  cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s;
}
.tab-btn:hover { color: var(--iom); }
.tab-btn.active { color: var(--iom); border-bottom-color: var(--iom); }

.tab-pane { display: none; padding: 14px 18px 18px; }
.tab-pane.active { display: block; }

/* ── Actions table ── */
.actions-header {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
  font-size: 11px;
}
.act-mini { display: flex; align-items: center; gap: 4px; }
.act-mini .dot { width: 7px; height: 7px; border-radius: 50%; }

.action-list { display: flex; flex-direction: column; gap: 6px; }
.action-row {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: start; gap: 10px;
  padding: 9px 12px; border-radius: 7px; background: var(--surface2);
  border: 1px solid var(--border);
}
.action-row:hover { border-color: #CBD5E1; }

.act-status {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 5px; padding: 3px 8px; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .4px; white-space: nowrap;
}
.act-status.identified { background: #EFF6FF; color: var(--st-identified); }
.act-status.accepted   { background: #F0FDFA; color: var(--st-accepted); }
.act-status.in-progress{ background: #FFFBEB; color: var(--st-in-progress); }
.act-status.completed  { background: #F0FDF4; color: var(--st-completed); }
.act-status.rejected   { background: #FEF2F2; color: var(--st-rejected); }
.act-status.partial    { background: #FFF7ED; color: var(--st-partial); }
.act-status.unknown    { background: #F8FAFC; color: var(--st-unknown); }

.action-text { font-size: 13px; line-height: 1.4; padding-top: 1px; }
.action-notes {
  font-size: 11px; color: var(--text3); margin-top: 4px; line-height: 1.4;
  grid-column: 2 / 3;
}

.no-data { font-size: 13px; color: var(--text3); font-style: italic; padding: 8px 0; }

/* ── Quotes ── */
.quote-list { display: flex; flex-direction: column; gap: 10px; }

.qcard {
  border-radius: 8px; padding: 12px 14px;
  border-left: 3px solid var(--border);
  background: var(--surface2);
  border: 1px solid var(--border);
}
.qcard.hansard { border-left-color: var(--tynwald); background: #FAF5FF; border-color: #E9D5FF; }
.qcard.report  { border-left-color: var(--iom);     background: #EFF6FF; border-color: #BFDBFE; }
.qcard.news    { border-left-color: var(--amber);   background: #FFFBEB; border-color: #FDE68A; }

.qcard-prov {
  display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap;
}
.prov-badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 4px; padding: 2px 8px; font-size: 10px; font-weight: 700; letter-spacing: .3px;
}
.prov-badge.hansard { background: var(--tynwald); color: #fff; }
.prov-badge.report  { background: var(--iom); color: #fff; }
.prov-badge.news    { background: var(--amber); color: #fff; }

.qcard-source { font-size: 11px; color: var(--text2); font-weight: 600; }
.qcard-speaker { font-size: 11px; color: var(--text3); }

.qcard-text {
  font-size: 13px; line-height: 1.6; color: var(--text);
  font-style: italic;
}
.qcard-text::before { content: '\201C'; }
.qcard-text::after  { content: '\201D'; }

/* ── Status key ── */
.key-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 18px; margin-bottom: 20px;
}
.key-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text3); margin-bottom: 10px; }
.key-grid { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.key-item { display: flex; align-items: center; gap: 7px; font-size: 12px; }

/* ── Timeline bar ── */
.timeline-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 18px 16px; margin-bottom: 20px;
  overflow-x: auto;
}
.tl-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text3); margin-bottom: 12px; }
.tl-track { position: relative; height: 56px; min-width: 600px; }
.tl-line { position: absolute; top: 22px; left: 0; right: 0; height: 2px; background: var(--border); }
.tl-year { position: absolute; top: 30px; font-size: 10px; color: var(--text3); transform: translateX(-50%); }
.tl-dot {
  position: absolute; top: 15px; width: 14px; height: 14px;
  border-radius: 50%; border: 2px solid var(--surface); cursor: pointer;
  transform: translateX(-50%);
  transition: transform .15s;
}
.tl-dot:hover { transform: translateX(-50%) scale(1.3); }
.tl-dot-label {
  position: absolute; top: 0px; font-size: 9px; font-weight: 600; color: var(--text2);
  white-space: nowrap; transform: translateX(-50%);
  max-width: 70px; overflow: hidden; text-overflow: ellipsis; text-align: center;
}

/* ── Empty state ── */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; }

@media (max-width: 600px) {
  .page { padding: 16px 12px 40px; }
  .hdr h1 { font-size: 18px; }
  .action-row { grid-template-columns: 1fr; }
  .action-notes { grid-column: 1; }
  .stat-pill .n { font-size: 16px; }
}
</style>
</head>

</div>

let activeFilters = new Set(['All']);
let allDomains = new Set();
REVIEWS.forEach(r => r.domains.forEach(d => allDomains.add(d)));

function computeStats() {
  let total = REVIEWS.length;
  let pub = REVIEWS.filter(r => r.published === true).length;
  let notPub = REVIEWS.filter(r => r.published === false).length;
  let unclear = REVIEWS.filter(r => r.published === null).length;

  let allActs = REVIEWS.flatMap(r => r.actions);
  let cnt = s => allActs.filter(a => a.status === s).length;

  return { total, pub, notPub, unclear,
    identified: cnt('identified'),
    accepted: cnt('accepted'),
    inProgress: cnt('in-progress'),
    completed: cnt('completed'),
    rejected: cnt('rejected'),
    partial: cnt('partial'),
  };
}

function renderStatPills() {
  const s = computeStats();
  const pills = [
    { label: 'Reviews', n: s.total, dot: null, filter: null },
    { label: 'Published', n: s.pub, dot: '#16A34A', filter: '__pub' },
    { label: 'Not published', n: s.notPub, dot: '#DC2626', filter: '__notpub' },
    { label: 'Completed actions', n: s.completed, dot: STATUS.completed.color, filter: '__completed' },
    { label: 'In progress', n: s.inProgress, dot: STATUS['in-progress'].color, filter: '__inprogress' },
    { label: 'Rejected', n: s.rejected, dot: STATUS.rejected.color, filter: '__rejected' },
    { label: 'Identified only', n: s.identified, dot: STATUS.identified.color, filter: '__identified' },
  ];
  document.getElementById('statPills').innerHTML = pills.map(p => `
    <div class="stat-pill" onclick="filterStat('${p.filter}')">
      ${p.dot ? `<span class="dot" style="background:${p.dot}"></span>` : ''}
      <span class="n">${p.n}</span>
      <span>${p.label}</span>
    </div>`).join('');
}

function renderKey() {
  document.getElementById('statusKey').innerHTML = Object.entries(STATUS).map(([k,v]) => `
    <div class="key-item">
      <div class="act-status ${k}" style="font-size:10px">${v.label}</div>
      <span style="font-size:11px;color:#5A6272">${statusDesc(k)}</span>
    </div>`).join('');
}

function statusDesc(s) {
  return {
    identified: 'In the report; no formal response yet',
    accepted: 'Government has committed to this',
    'in-progress': 'Accepted and being implemented',
    completed: 'Done',
    rejected: 'Explicitly rejected or deprioritised',
    partial: 'Partially implemented',
    unknown: 'Cannot determine from available information',
  }[s] || '';
}

function renderFilters() {
  const domains = ['All', ...Array.from(allDomains).sort()];
  document.getElementById('filters').innerHTML =
    `<span class="filter-label">Domain</span>` +
    domains.map(d => `<button class="filter-btn ${d==='All'?'on':''}" onclick="toggleFilter('${d}',this)">${d}</button>`).join('');
}

function toggleFilter(domain, btn) {
  if (domain === 'All') {
    activeFilters = new Set(['All']);
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  } else {
    activeFilters.delete('All');
    document.querySelector('.filter-btn').classList.remove('on');
    btn.classList.toggle('on');
    if (btn.classList.contains('on')) activeFilters.add(domain);
    else activeFilters.delete(domain);
    if (activeFilters.size === 0) {
      activeFilters.add('All');
      document.querySelector('.filter-btn').classList.add('on');
    }
  }
  applyFilters();
}

function filterStat(f) { /* reserved for stat pill clicks */ }

function applyFilters() {
  document.querySelectorAll('.rcard').forEach(el => {
    const id = el.dataset.id;
    const rev = REVIEWS.find(r => r.id === id);
    if (!rev) return;
    const show = activeFilters.has('All') ||
      rev.domains.some(d => activeFilters.has(d));
    el.classList.toggle('hidden', !show);
  });
}

function renderTimeline() {
  const minYear = 2018.5, maxYear = 2026.8;
  const span = maxYear - minYear;
  const years = [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026];
  const tl = document.getElementById('timeline');

  years.forEach(y => {
    const pct = ((y - minYear) / span * 100).toFixed(1);
    const el = document.createElement('div');
    el.className = 'tl-year';
    el.style.left = pct + '%';
    el.textContent = y;
    tl.appendChild(el);
  });

  const dotColors = ['#1B6CA8','#DC2626','#6B21A8','#16A34A','#0D9488','#EA580C','#D97706'];
  REVIEWS.forEach((r, i) => {
    const pct = ((r.dateSort - minYear) / span * 100).toFixed(1);
    const dot = document.createElement('div');
    dot.className = 'tl-dot';
    dot.style.left = pct + '%';
    dot.style.background = dotColors[i % dotColors.length];
    dot.title = r.shortName + ' — ' + r.dateLabel;
    dot.onclick = () => {
      const card = document.getElementById('card-' + r.id);
      if (card) { card.scrollIntoView({behavior:'smooth', block:'center'}); openCard(card); }
    };
    tl.appendChild(dot);

    const lbl = document.createElement('div');
    lbl.className = 'tl-dot-label';
    lbl.style.left = pct + '%';
    lbl.style.color = dotColors[i % dotColors.length];
    lbl.textContent = r.shortName;
    tl.appendChild(lbl);
  });
}

function actionCountBadges(actions) {
  const counts = {};
  actions.forEach(a => { counts[a.status] = (counts[a.status]||0)+1; });
  return Object.entries(counts).map(([s,n]) =>
    `<span class="act-mini"><span class="dot" style="background:${STATUS[s]?.color||'#ccc'}"></span> <span style="font-size:11px;color:#5A6272">${n} ${STATUS[s]?.label||s}</span></span>`
  ).join('');
}

function renderCards() {
  const container = document.getElementById('cards');
  container.innerHTML = '';

  REVIEWS.forEach(rev => {
    const quotes = QUOTES.filter(q => q.reviewId === rev.id);
    const pubBadge = rev.published === true ? '<span class="pub-badge yes">✓ Published</span>'
      : rev.published === false ? '<span class="pub-badge no">✗ Not published</span>'
      : '<span class="pub-badge unclear">? Publication unclear</span>';

    const domTags = rev.domains.map(d => `<span class="dtag">${d}</span>`).join('');

    const actRows = rev.actions.length
      ? rev.actions.map(a => `
        <div class="action-row">
          <span class="act-status ${a.status}">${STATUS[a.status]?.label||a.status}</span>
          <div>
            <div class="action-text">${a.text}</div>
            ${a.notes ? `<div class="action-notes">ℹ ${a.notes}</div>` : ''}
          </div>
        </div>`).join('')
      : '<div class="no-data">No specific actions extracted yet for this review.</div>';

    const quoteCards = quotes.length
      ? quotes.map(q => `
        <div class="qcard ${q.type}">
          <div class="qcard-prov">
            <span class="prov-badge ${q.type}">${q.type === 'hansard' ? '📜 Hansard' : q.type === 'report' ? '📄 Report' : '🗞 News'}</span>
            <span class="qcard-source">${q.source}</span>
          </div>
          <div class="qcard-speaker">${q.speaker}</div>
          <div class="qcard-text" style="margin-top:6px">${q.text}</div>
        </div>`).join('')
      : '<div class="no-data">No quotes extracted yet. Add from Hansard, report or news.</div>';

    const card = document.createElement('div');
    card.className = 'rcard';
    card.id = 'card-' + rev.id;
    card.dataset.id = rev.id;
    card.innerHTML = `
      <div class="rcard-hdr" onclick="toggleCard(this.closest('.rcard'))">
        <div>
          <div class="rcard-title-row">
            <span class="rcard-title">${rev.shortName}</span>
            <span class="rcard-year">${rev.dateLabel}</span>
          </div>
          <div class="rcard-title" style="font-size:12px;font-weight:400;color:#5A6272;margin-top:1px">${rev.title}</div>
          <div class="rcard-meta" style="margin-top:6px">
            <span>${rev.author}</span>
            <span>Commissioned by ${rev.commissioner}</span>
          </div>
          <div style="margin-top:8px">${domTags}</div>
        </div>
        <div class="rcard-right">
          ${pubBadge}
          ${rev.url ? `<a href="${rev.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px;color:var(--iom);text-decoration:none;display:flex;align-items:center;gap:3px">📄 ${rev.urlLabel}</a>` : rev.urlLabel ? `<span style="font-size:11px;color:#94A3B8;font-style:italic">${rev.urlLabel}</span>` : ''}
          ${rev.url2 ? `<a href="${rev.url2}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px;color:var(--iom);text-decoration:none;display:flex;align-items:center;gap:3px">📄 ${rev.url2Label}</a>` : ''}
          ${rev.url3 ? `<a href="${rev.url3}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-size:11px;color:var(--iom);text-decoration:none;display:flex;align-items:center;gap:3px">📄 ${rev.url3Label}</a>` : ''}
          <span style="font-size:11px;color:#94A3B8">${rev.actions.length} actions · ${quotes.length} quotes</span>
          <span class="chevron">▼</span>
        </div>
      </div>

      <div class="rcard-summary">${rev.summary}</div>

      <div class="rcard-tabs">
        <div class="tab-bar">
          <div class="tab-btn active" onclick="switchTab(event, '${rev.id}', 'actions')">
            Actions (${rev.actions.length})
          </div>
          <div class="tab-btn" onclick="switchTab(event, '${rev.id}', 'quotes')">
            Quotes (${quotes.length})
          </div>
        </div>
        <div id="${rev.id}-actions" class="tab-pane active">
          <div class="actions-header">${actionCountBadges(rev.actions)}</div>
          <div class="action-list">${actRows}</div>
        </div>
        <div id="${rev.id}-quotes" class="tab-pane">
          <div class="quote-list">${quoteCards}</div>
        </div>
      </div>`;

    container.appendChild(card);
  });
}

function openCard(card) {
  if (!card.classList.contains('open')) card.classList.add('open');
}

function toggleCard(card) {
  card.classList.toggle('open');
}

function switchTab(e, reviewId, pane) {
  e.stopPropagation();
  const tabs = e.target.closest('.tab-bar').querySelectorAll('.tab-btn');
  const panes = e.target.closest('.rcard-tabs').querySelectorAll('.tab-pane');
  tabs.forEach(t => t.classList.remove('active'));
  panes.forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(reviewId + '-' + pane).classList.add('active');
}

/* ── Init ── */
renderStatPills();
renderKey();
renderFilters();
renderTimeline();
renderCards();
</script>
