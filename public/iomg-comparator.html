<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Series Comparator · Coalfinch Observatory</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0f1e;--surface:#0d1526;--border:#1e2d4d;--gold:#C9A24A;--text:#e2e8f0;--muted:#64748b}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;font-size:14px;overflow:hidden;display:flex;flex-direction:column}

.hdr{padding:8px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-left{display:flex;align-items:center;gap:14px}
.chart-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
.back-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:0 10px;height:26px;font-size:11px;cursor:pointer;font-family:"Inter",sans-serif}
.back-btn:hover{border-color:var(--gold);color:var(--text)}

.controls{display:flex;align-items:center;gap:10px;padding:6px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.ctrl-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.norm-toggle{display:flex;gap:4px}
.norm-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:0 10px;height:26px;font-size:10px;cursor:pointer;font-family:"Inter",sans-serif;transition:all .15s}
.norm-btn.active{background:var(--gold);color:#0a0f1e;border-color:var(--gold);font-weight:700}
.norm-btn:hover:not(.active){border-color:var(--gold);color:var(--text)}
.ctrl-sep{width:1px;height:18px;background:var(--border);flex-shrink:0}
.base-wrap{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
select.base-yr{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:10px;padding:0 6px;height:26px;cursor:pointer}
.series-count{font-size:10px;color:var(--muted);margin-left:auto;flex-shrink:0}

.main{flex:1;display:flex;overflow:hidden}

/* Series selector panel */
.selector{width:220px;flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:10px 0}
.sel-group{margin-bottom:2px}
.sel-group-hdr{padding:4px 14px;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);opacity:.7}
.sel-item{display:flex;align-items:center;gap:8px;padding:5px 14px;cursor:pointer;transition:background .1s;user-select:none}
.sel-item:hover{background:#ffffff08}
.sel-item.selected{background:#ffffff0c}
.sel-item.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.sel-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid transparent}
.sel-item.selected .sel-dot{border-color:transparent}
.sel-name{font-size:11px;color:var(--text);flex:1}
.sel-sub{font-size:9px;color:var(--muted)}
.sel-check{font-size:10px;color:var(--muted);flex-shrink:0}

/* Chart area */
.chart-area{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 16px}
.chart-wrap{flex:1;position:relative}
.chart-wrap canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 0;flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);cursor:pointer}
.legend-item:hover{color:var(--text)}
.legend-dot{width:10px;height:3px;border-radius:2px;flex-shrink:0}
.legend-x{font-size:9px;color:#475569;margin-left:2px;cursor:pointer}
.legend-x:hover{color:#f87171}

.empty-state{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;opacity:.4}
.empty-state svg{width:40px;height:40px;stroke:var(--muted)}
.empty-state p{font-size:12px;color:var(--muted)}

.data-note{font-size:9px;color:#475569;padding:4px 0 0;flex-shrink:0;line-height:1.5}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <button class="back-btn" onclick="history.back()">← Back to Sankey</button>
    <div class="chart-title">Series Comparator</div>
  </div>
  <div style="font-size:9px;color:var(--muted)">Select up to 5 series · shapes compared non-dimensionally</div>
</div>

<div class="controls">
  <span class="ctrl-label">Normalise</span>
  <div class="norm-toggle">
    <button class="norm-btn active" id="btn-index" onclick="setNorm('index')">Index = 100</button>
    <button class="norm-btn" id="btn-zscore" onclick="setNorm('zscore')">Z-score</button>
    <button class="norm-btn" id="btn-pctpeak" onclick="setNorm('pctpeak')">% of peak</button>
    <button class="norm-btn" id="btn-raw" onclick="setNorm('raw')">Raw values</button>
  </div>
  <div class="ctrl-sep"></div>
  <div class="base-wrap" id="base-wrap">
    Base year:
    <select class="base-yr" id="base-yr-sel" onchange="redraw()">
      <option value="2016">FY2016</option>
      <option value="2017">FY2017</option>
      <option value="2018">FY2018</option>
      <option value="2019">FY2019</option>
      <option value="2020">FY2020</option>
      <option value="2021">FY2021</option>
      <option value="2022">FY2022</option>
      <option value="2023">FY2023</option>
      <option value="2024" selected>FY2024</option>
      <option value="2025">FY2025</option>
    </select>
  </div>
  <div class="ctrl-sep"></div>
  <label style="display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);cursor:pointer">
    <input type="checkbox" id="deflate-chk" checked style="accent-color:var(--gold)">
    Constant prices
  </label>
  <span class="series-count" id="series-count">0 / 5 series selected</span>
</div>

<div class="main">
  <div class="selector" id="selector"></div>
  <div class="chart-area">
    <div class="chart-wrap" id="chart-wrap">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-8"/></svg>
        <p>Select series from the panel to compare</p>
      </div>
      <canvas id="main-chart" style="display:none"></canvas>
    </div>
    <div class="chart-legend" id="chart-legend"></div>
    <div class="data-note" id="data-note"></div>
  </div>
</div>

<script>
// ── Palette ───────────────────────────────────────────────────────────────────
const PALETTE = ['#C9A24A','#f87171','#60a5fa','#4ade80','#c084fc','#fb923c','#f59e0b','#94a3b8','#34d399','#818cf8'];

// ── Deflators ─────────────────────────────────────────────────────────────────
const DEFLATORS={2016:1.333936,2017:1.284234,2018:1.252817,2019:1.227988,
  2020:1.232931,2021:1.17894,2022:1.081041,2023:1.023646,2024:1.0,2025:1.0};

// ── Raw data (same as Sankey) ─────────────────────────────────────────────────
const DATA={"2016":{"rev":{"CustomsExcise":327838.606,"IncomeTax":184253.784,"OtherTreasuryIncome":10269.977,"NIOperatingAccount":186753.633},"grp_gross":{"Health & Care":244455,"Social Security":274850,"Education":94265,"Infrastructure":99487,"Enterprise":30923,"Treasury Ops":27749,"Other Gov":225123},"cats4":{"Employee Costs":354331,"Infrastructure":52184,"Supplies & Services":143278,"Loan & Other":94772,"Agency & Contracted":77437,"Social Security":274850},"total_gross":996852,"total_gra":709116,"total_own":287736},"2017":{"rev":{"CustomsExcise":367330.2,"IncomeTax":129324.1,"OtherTreasuryIncome":9900,"NIOperatingAccount":134139.7},"grp_gross":{"Health & Care":240168,"Social Security":296614,"Education":98997,"Infrastructure":108131,"Enterprise":32710,"Treasury Ops":5861,"Other Gov":248824},"cats4":{"Employee Costs":440091,"Infrastructure":58434,"Supplies & Services":115393,"Loan & Other":40011,"Agency & Contracted":80762,"Social Security":296614},"total_gross":1031305,"total_gra":640694,"total_own":350576},"2018":{"rev":{"CustomsExcise":312871.7,"IncomeTax":203116.6,"OtherTreasuryIncome":9510.6,"NIOperatingAccount":215602.1},"grp_gross":{"Health & Care":273626,"Social Security":318378,"Education":100104,"Infrastructure":113695,"Enterprise":32550,"Treasury Ops":34496,"Other Gov":157535},"cats4":{"Employee Costs":396550,"Infrastructure":57111,"Supplies & Services":149709,"Loan & Other":24820,"Agency & Contracted":83816,"Social Security":318378},"total_gross":1030384,"total_gra":741101,"total_own":289283},"2019":{"rev":{"CustomsExcise":354138.3,"IncomeTax":227732.9,"OtherTreasuryIncome":10060.8,"NIOperatingAccount":241109},"grp_gross":{"Health & Care":276889,"Social Security":321511,"Education":111740,"Infrastructure":120289,"Enterprise":27605,"Treasury Ops":31018,"Other Gov":244856},"cats4":{"Employee Costs":407990,"Infrastructure":56700,"Supplies & Services":155985,"Loan & Other":105683,"Agency & Contracted":86039,"Social Security":321511},"total_gross":1133908,"total_gra":833041,"total_own":300867},"2020":{"rev":{"CustomsExcise":370962.6,"IncomeTax":201218.8,"OtherTreasuryIncome":8599.6,"NIOperatingAccount":223394},"grp_gross":{"Health & Care":285677,"Social Security":325877,"Education":118534,"Infrastructure":126270,"Enterprise":26748,"Treasury Ops":13647,"Other Gov":203019},"cats4":{"Employee Costs":401537,"Infrastructure":53973,"Supplies & Services":119126,"Loan & Other":109273,"Agency & Contracted":89986,"Social Security":325877},"total_gross":1099772,"total_gra":804175,"total_own":295597},"2021":{"rev":{"CustomsExcise":329765.8,"IncomeTax":235929.5,"OtherTreasuryIncome":6744.1,"NIOperatingAccount":304590.6},"grp_gross":{"Health & Care":277824,"Social Security":381641,"Education":119374,"Infrastructure":115749,"Enterprise":24377,"Treasury Ops":0,"Other Gov":225866},"cats4":{"Employee Costs":447027,"Infrastructure":54711,"Supplies & Services":146103,"Loan & Other":27854,"Agency & Contracted":86488,"Social Security":381641},"total_gross":1143824,"total_gra":877030,"total_own":266794},"2022":{"rev":{"CustomsExcise":408252.3,"IncomeTax":232727.2,"OtherTreasuryIncome":8448.2,"NIOperatingAccount":295505.3},"grp_gross":{"Health & Care":294790,"Social Security":394975,"Education":118160,"Infrastructure":99453,"Enterprise":24346,"Treasury Ops":64886,"Other Gov":248835},"cats4":{"Employee Costs":467330,"Infrastructure":59654,"Supplies & Services":247788,"Loan & Other":-17457,"Agency & Contracted":93155,"Social Security":394975},"total_gross":1245445,"total_gra":944933,"total_own":300512},"2023":{"rev":{"CustomsExcise":447224,"IncomeTax":272105.3,"OtherTreasuryIncome":11638.6,"NIOperatingAccount":303308.1},"grp_gross":{"Health & Care":314191,"Social Security":375845,"Education":121773,"Infrastructure":102339,"Enterprise":29408,"Treasury Ops":73919,"Other Gov":372073},"cats4":{"Employee Costs":517915,"Infrastructure":66594,"Supplies & Services":252394,"Loan & Other":72747,"Agency & Contracted":104053,"Social Security":375845},"total_gross":1389548,"total_gra":1034276,"total_own":355272},"2024":{"rev":{"CustomsExcise":436412.7,"IncomeTax":321056.2,"OtherTreasuryIncome":15850.5,"NIOperatingAccount":322437.6},"grp_gross":{"Health & Care":369982,"Social Security":390610,"Education":142147,"Infrastructure":117914,"Enterprise":27259,"Treasury Ops":60784,"Other Gov":336065},"cats4":{"Employee Costs":575715,"Infrastructure":74250,"Supplies & Services":204615,"Loan & Other":84064,"Agency & Contracted":115507,"Social Security":390610},"total_gross":1444761,"total_gra":1095757,"total_own":349004},"2025":{"rev":{"CustomsExcise":480939.2,"IncomeTax":358210.5,"OtherTreasuryIncome":4865.2,"NIOperatingAccount":302829.2},"grp_gross":{"Health & Care":387072,"Social Security":415793,"Education":152565,"Infrastructure":123247,"Enterprise":30850,"Treasury Ops":51323,"Other Gov":333596},"cats4":{"Employee Costs":614180,"Infrastructure":80028,"Supplies & Services":199888,"Loan & Other":66435,"Agency & Contracted":118122,"Social Security":415793},"total_gross":1494446,"total_gra":1146844,"total_own":347602}};

// ── All available series ──────────────────────────────────────────────────────
const ALL_YEARS = [2016,2017,2018,2019,2020,2021,2022,2023,2024,2025];

function makeFlowSeries(getter, unit='£m', scale=1/1000) {
  const pts = {};
  ALL_YEARS.forEach(y => {
    const d = DATA[String(y)];
    if (d) { const v = getter(d); if (v != null) pts[y] = v * scale; }
  });
  return pts;
}

const SERIES_DEFS = [
  // ── Revenue
  { group:'Revenue Sources', id:'ce',   label:'Customs & Excise',    color:'#f59e0b', unit:'£m', pts: makeFlowSeries(d=>d.rev.CustomsExcise) },
  { group:'Revenue Sources', id:'it',   label:'Income Tax',          color:'#fcd34d', unit:'£m', pts: makeFlowSeries(d=>d.rev.IncomeTax) },
  { group:'Revenue Sources', id:'ni',   label:'National Insurance',  color:'#fb923c', unit:'£m', pts: makeFlowSeries(d=>d.rev.NIOperatingAccount) },
  { group:'Revenue Sources', id:'ot',   label:'Other Treasury',      color:'#94a3b8', unit:'£m', pts: makeFlowSeries(d=>d.rev.OtherTreasuryIncome) },
  { group:'Revenue Sources', id:'gra',  label:'Total GRA Revenue',   color:'#C9A24A', unit:'£m', pts: makeFlowSeries(d=>d.total_gra) },
  // ── Departments
  { group:'Department Groups', id:'hc',   label:'Health & Care',     color:'#f87171', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Health & Care']) },
  { group:'Department Groups', id:'ss',   label:'Social Security',   color:'#fb923c', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Social Security']) },
  { group:'Department Groups', id:'ed',   label:'Education',         color:'#60a5fa', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Education']) },
  { group:'Department Groups', id:'doi',  label:'Infrastructure',    color:'#94a3b8', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Infrastructure']) },
  { group:'Department Groups', id:'ent',  label:'Enterprise',        color:'#4ade80', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Enterprise']) },
  { group:'Department Groups', id:'oag',  label:'Other Gov',         color:'#818cf8', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Other Gov']) },
  { group:'Department Groups', id:'treas',label:'Treasury Ops',      color:'#C9A24A', unit:'£m', pts: makeFlowSeries(d=>d.grp_gross['Treasury Ops']) },
  // ── Expenditure types
  { group:'Expenditure Types', id:'emp', label:'Employee Costs',         color:'#f87171', unit:'£m', pts: makeFlowSeries(d=>d.cats4['Employee Costs']) },
  { group:'Expenditure Types', id:'ssc', label:'Social Security (exp)',  color:'#fb923c', unit:'£m', pts: makeFlowSeries(d=>d.cats4['Social Security']) },
  { group:'Expenditure Types', id:'sup', label:'Supplies & Services',    color:'#4ade80', unit:'£m', pts: makeFlowSeries(d=>d.cats4['Supplies & Services']) },
  { group:'Expenditure Types', id:'age', label:'Agency & Contracted',    color:'#c084fc', unit:'£m', pts: makeFlowSeries(d=>d.cats4['Agency & Contracted']) },
  { group:'Expenditure Types', id:'inf', label:'Infra Expenditure',      color:'#60a5fa', unit:'£m', pts: makeFlowSeries(d=>d.cats4['Infrastructure']) },
  // ── Stocks
  { group:'Balance Sheet Stocks', id:'nif',  label:'NI Fund',              color:'#60a5fa', unit:'£m',
    pts: {2017:793.7,2018:808.5,2019:884.8,2020:839.8,2021:883.4,2022:924.6,2023:969.4,2024:1025.1},
    types:{2018:'probable'},
    note:'NI Fund estimated market value (Pink Books). FY2018 is probable.' },
  { group:'Balance Sheet Stocks', id:'resf', label:'Reserve Fund',         color:'#4ade80', unit:'£m',
    pts: {2016:375.7,2017:351.3,2018:386.4,2019:380.5,2020:448.2,2021:639.5,2022:565.5,2023:634.9,2024:596.3},
    note:'Reserve Fund + Bond Issue market value (management accounts, Pink Books).' },
  { group:'Balance Sheet Stocks', id:'cfr',  label:'Capital Financing Reserve', color:'#f59e0b', unit:'£m',
    pts: {2016:0.947,2017:46.5,2018:46.5,2019:44.1,2020:85.6,2021:56.9,2022:26.0,2023:34.8,2024:24.8},
    types:{2017:'probable',2018:'budget',2019:'budget',2020:'probable',2022:'probable'},
    note:'CFR balance C/F. Several years are budget projections — treat as approximate.' },
  { group:'Balance Sheet Stocks', id:'pen',  label:'Pension Liability',    color:'#f87171', unit:'£bn',
    pts: {2013:2.318,2014:3.009,2015:2.991,2016:3.823,2017:3.723,2018:4.1,2019:3.8,2020:4.8,2021:4.586,2022:2.902},
    types:{2018:'secondary',2019:'secondary',2020:'secondary'},
    note:'FRS17 to 2014-15; FRS102 from 2015-16. 2018-20 from journalism citing audited accounts (~±£100m). Highly discount-rate sensitive.' },
];

// ── State ─────────────────────────────────────────────────────────────────────
let selected = new Set();
let normMode = 'index';
let chart = null;

function setNorm(mode) {
  normMode = mode;
  document.querySelectorAll('.norm-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + mode).classList.add('active');
  document.getElementById('base-wrap').style.display = mode === 'index' ? 'flex' : 'none';
  redraw();
}

function getDefl(y) {
  return document.getElementById('deflate-chk').checked ? (DEFLATORS[y] || 1) : 1;
}

function getRawPts(def) {
  // Apply deflation to flow series (not stock series — stocks are already in real £)
  const isStock = def.group === 'Balance Sheet Stocks';
  const pts = {};
  Object.entries(def.pts).forEach(([yr, v]) => {
    const y = Number(yr);
    pts[y] = isStock ? v : v * getDefl(y);
  });
  return pts;
}

function normalise(pts, mode, baseYr) {
  const ys = Object.keys(pts).map(Number).sort();
  const vals = ys.map(y => pts[y]);
  if (mode === 'raw') return {ys, vals};
  if (mode === 'index') {
    const baseV = pts[baseYr] ?? vals[0];
    return {ys, vals: vals.map(v => v == null ? null : (v / baseV) * 100)};
  }
  if (mode === 'pctpeak') {
    const peak = Math.max(...vals.filter(v => v != null));
    return {ys, vals: vals.map(v => v == null ? null : (v / peak) * 100)};
  }
  if (mode === 'zscore') {
    const valid = vals.filter(v => v != null);
    const mean = valid.reduce((a,b) => a+b, 0) / valid.length;
    const sd = Math.sqrt(valid.reduce((a,b) => a + (b-mean)**2, 0) / valid.length);
    return {ys, vals: sd === 0 ? vals.map(() => 0) : vals.map(v => v == null ? null : (v - mean) / sd)};
  }
  return {ys, vals};
}

function redraw() {
  const baseYr = Number(document.getElementById('base-yr-sel').value);
  const empty = document.getElementById('empty-state');
  const canvas = document.getElementById('main-chart');
  const legend = document.getElementById('chart-legend');
  const note = document.getElementById('data-note');

  if (selected.size === 0) {
    empty.style.display = 'flex';
    canvas.style.display = 'none';
    legend.innerHTML = '';
    note.textContent = '';
    return;
  }
  empty.style.display = 'none';
  canvas.style.display = 'block';

  const datasets = [];
  const notes = [];
  let colIdx = 0;

  selected.forEach(sid => {
    const def = SERIES_DEFS.find(d => d.id === sid);
    if (!def) return;
    const rawPts = getRawPts(def);
    const {ys, vals} = normalise(rawPts, normMode, baseYr);
    const col = def.color || PALETTE[colIdx % PALETTE.length];
    const types = def.types || {};

    datasets.push({
      label: def.label,
      data: ys.map((y,i) => ({x: 'FY'+y, y: vals[i]})),
      borderColor: col,
      backgroundColor: col + '22',
      borderWidth: 2,
      pointRadius: ys.map(y => 4),
      pointBackgroundColor: ys.map(y => {
        const t = types[y];
        return t === 'secondary' ? col + '66' : t === 'budget' || t === 'probable' ? col + 'aa' : col;
      }),
      pointStyle: ys.map(y => {
        const t = types[y];
        return t === 'secondary' ? 'triangle' : t === 'budget' || t === 'probable' ? 'rectRot' : 'circle';
      }),
      fill: false,
      tension: 0.3,
      spanGaps: true,
      segment: {
        borderDash: ctx => {
          const y = Number(ys[ctx.p0DataIndex]);
          const t = types[y];
          return (t === 'secondary' || t === 'budget') ? [4, 3] : undefined;
        }
      }
    });
    if (def.note) notes.push(def.label + ': ' + def.note);
    colIdx++;
  });

  // All unique x labels
  const allYs = [...new Set(datasets.flatMap(d => d.data.map(p => p.x)))].sort();

  const yLabel = normMode === 'index' ? 'Index (base = 100)' :
                 normMode === 'zscore' ? 'Z-score (σ)' :
                 normMode === 'pctpeak' ? '% of peak' : 'Value';

  if (chart) { chart.destroy(); chart = null; }

  chart = new Chart(canvas, {
    type: 'line',
    data: { labels: allYs, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          mode: 'index',
          intersect: false,
          backgroundColor: '#1e293b',
          titleColor: '#e2e8f0',
          bodyColor: '#94a3b8',
          borderColor: '#1e2d4d',
          borderWidth: 1,
          callbacks: {
            label: ctx => {
              const v = ctx.raw?.y;
              if (v == null) return null;
              const label = ctx.dataset.label;
              const def = SERIES_DEFS.find(d => d.label === label);
              const yr = Number(ctx.label?.replace('FY',''));
              const t = (def?.types||{})[yr];
              const flag = t === 'secondary' ? ' ⚠~' : t === 'budget' ? ' ~bud' : t === 'probable' ? ' ~prob' : '';
              const fmt = normMode === 'raw'
                ? (def?.unit === '£bn' ? '£' + v.toFixed(2) + 'bn' : '£' + Math.round(v) + 'm')
                : v.toFixed(1);
              return ` ${label}: ${fmt}${flag}`;
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: '#1e2d4d' } },
        y: {
          title: { display: true, text: yLabel, color: '#475569', font: { size: 9 } },
          ticks: { color: '#64748b', font: { size: 9 } },
          grid: { color: '#1e2d4d' },
          ...(normMode === 'index' ? { min: 0 } : {})
        }
      }
    }
  });

  // Legend
  legend.innerHTML = '';
  datasets.forEach((ds, i) => {
    const sid = [...selected][i];
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${ds.borderColor}"></div>
      <span>${ds.label}</span>
      <span class="legend-x" title="Remove" data-sid="${sid}">✕</span>`;
    item.querySelector('.legend-x').addEventListener('click', e => {
      deselectSeries(e.target.dataset.sid);
    });
    legend.appendChild(item);
  });

  // Data notes
  note.textContent = notes.length ? '⚠ ' + notes.join(' | ') : '';
}

function deselectSeries(sid) {
  selected.delete(sid);
  renderSelector();
  redraw();
  updateCount();
}

function toggleSeries(sid) {
  if (selected.has(sid)) {
    selected.delete(sid);
  } else {
    if (selected.size >= 5) return;
    selected.add(sid);
  }
  renderSelector();
  redraw();
  updateCount();
}

function updateCount() {
  document.getElementById('series-count').textContent = `${selected.size} / 5 series selected`;
}

function renderSelector() {
  const sel = document.getElementById('selector');
  const groups = {};
  SERIES_DEFS.forEach(d => {
    if (!groups[d.group]) groups[d.group] = [];
    groups[d.group].push(d);
  });

  sel.innerHTML = '';
  Object.entries(groups).forEach(([g, items]) => {
    const ghdr = document.createElement('div');
    ghdr.className = 'sel-group';
    ghdr.innerHTML = `<div class="sel-group-hdr">${g}</div>`;

    items.forEach(def => {
      const isSel = selected.has(def.id);
      const isDisabled = !isSel && selected.size >= 5;
      const item = document.createElement('div');
      item.className = 'sel-item' + (isSel ? ' selected' : '') + (isDisabled ? ' disabled' : '');
      item.innerHTML = `
        <div class="sel-dot" style="background:${isSel ? def.color : 'transparent'};border-color:${def.color}"></div>
        <span class="sel-name">${def.label}</span>
        <span class="sel-check">${isSel ? '✓' : ''}</span>`;
      item.addEventListener('click', () => toggleSeries(def.id));
      ghdr.appendChild(item);
    });
    sel.appendChild(ghdr);
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('deflate-chk').addEventListener('change', redraw);
document.getElementById('base-yr-sel').addEventListener('change', redraw);
setNorm('index');
renderSelector();
updateCount();
</script>
</body>
</html>
