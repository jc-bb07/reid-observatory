<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#162032;--border:#1e293b;--border2:#334155;
      --text:#e2e8f0;--muted:#64748b;--muted2:#475569;--blue:#60a5fa;--blue-dim:#1d4ed8;
      --green:#34d399;--amber:#fbbf24;--red:#f87171;--purple:#a78bfa;--orange:#fb923c;--iom:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;padding:20px}
h1{font-size:19px;font-weight:800;letter-spacing:-0.01em;margin-bottom:3px}
.eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}
.tabs{display:flex;gap:2px;margin-bottom:18px;border-bottom:1px solid var(--border2)}
.tab{padding:7px 16px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--text)}.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.ctrl-group{display:flex;align-items:center;gap:6px}
.ctrl-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--border2);color:var(--text);padding:5px 8px;border-radius:5px;font-size:12px;font-family:inherit;cursor:pointer}
select:focus{outline:none;border-color:var(--blue)}
.pill{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.pill-btn{padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--muted);transition:all .15s}
.pill-btn.active{background:var(--blue-dim);color:#fff}
.chart-wrap{position:relative;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:16px 16px 8px;margin-bottom:12px}
.play-bar{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border2)}
.btn-play{padding:5px 14px;font-size:11px;font-weight:700;border:none;border-radius:5px;cursor:pointer;background:var(--blue-dim);color:#fff;min-width:70px;transition:background .15s}
.btn-play:hover{background:var(--iom)}
.scrubber{flex:1;accent-color:var(--blue);cursor:pointer;height:4px}
.yr-badge{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--blue);min-width:58px;text-align:right}
.spd-wrap{display:flex;gap:3px;align-items:center}
.spd-btn{padding:2px 7px;font-size:10px;font-weight:700;border:1px solid var(--border2);background:none;color:var(--muted);border-radius:4px;cursor:pointer;transition:all .12s}
.spd-btn.active{background:var(--surface);color:var(--text)}
.legend-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.legend-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend-acts{display:flex;gap:10px}
.lnk{font-size:11px;color:var(--blue);cursor:pointer;background:none;border:none;text-decoration:underline;padding:0}
.legend-grid{display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:14px}
.leg-item{display:flex;align-items:center;gap:5px;cursor:pointer;padding:2px 6px;border-radius:4px;border:1px solid transparent;transition:border-color .12s,opacity .12s;user-select:none}
.leg-item:hover{border-color:var(--border2)}.leg-item.off{opacity:.3}
.swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.leg-name{font-size:11px;color:var(--muted2)}
.note{font-size:11px;color:var(--muted);line-height:1.65;padding:9px 12px;background:var(--surface2);border-left:2px solid var(--border2);border-radius:0 4px 4px 0}
.tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.04em}
.tag-break{background:#f8717122;color:#f87171}
.tag-approx{background:#fbbf2422;color:#fbbf24}
</style>
</head>

// ── helpers ───────────────────────────────────────────────────────────────
function groupTotals(yr){
  const out={};
  for(const [s,info] of Object.entries(DATA[yr]||{})){
    if(!out[info.g]) out[info.g]=0; out[info.g]+=info.v;
  }
  return out;
}
function toReal(val,yr){
  if(realMode==='nominal') return val;
  const d=DEFLATORS[yr]; return d?Math.round(val*d):null;
}

// ── dataset builders ──────────────────────────────────────────────────────
function groupItems()  { return GROUP_ORDER.map(g=>({key:g,label:g,c:GROUP_META[g].c})); }
function sectorItems(){
  const ss=new Set(); ALL_YEARS.forEach(yr=>Object.keys(DATA[yr]||{}).forEach(s=>ss.add(s)));
  return [...ss].sort((a,b)=>{
    const oa=GROUP_META[SECTOR_META[a]?.g]?.order??99, ob=GROUP_META[SECTOR_META[b]?.g]?.order??99;
    return oa!==ob?oa-ob:a.localeCompare(b);
  }).map(s=>({key:s,label:s,c:SECTOR_META[s]?.c||'#888'}));
}
function items(){ return viewMode==='groups'?groupItems():sectorItems(); }

function getValue(yr,key,isGroup){
  if(hidden.has(key)) return 0;
  if(isGroup){
    const tots=groupTotals(yr); return tots[key]||0;
  } else {
    return DATA[yr]?.[key]?.v||0;
  }
}

// Line datasets (Absolute tab)
function lineDatasets(years){
  const isGroup=viewMode==='groups';
  return items().map(({key,label,c})=>{
    if(hidden.has(key)) return null;
    if(!isGroup && hidden.has(SECTOR_META[key]?.g)) return null;
    const data=years.map(yr=>{
      const raw=getValue(yr,key,isGroup);
      const v=toReal(raw,yr);
      return v!==null?Math.round(v/1000):null;
    });
    return {label,data,borderColor:c,backgroundColor:c+'22',borderWidth:2,
             pointRadius:2,pointHoverRadius:4,fill:false,tension:0.35,spanGaps:false};
  }).filter(Boolean);
}

// Stacked bar (Relative tab)
function relDatasets(years){
  const isGroup=viewMode==='groups';
  return items().map(({key,label,c})=>{
    if(hidden.has(key)) return null;
    if(!isGroup && hidden.has(SECTOR_META[key]?.g)) return null;
    const data=years.map(yr=>{
      const raw=getValue(yr,key,isGroup);
      const total=Object.values(DATA[yr]||{}).reduce((a,b)=>a+b.v,0);
      return total?parseFloat((raw/total*100).toFixed(2)):0;
    });
    return {label,data,backgroundColor:c+'cc',borderColor:c,borderWidth:0.5};
  }).filter(Boolean);
}

// Stacked area (Mix tab) - all years, fill clipped by plugin
function mixDatasets(){
  const isGroup=viewMode==='groups';
  return items().map(({key,label,c},idx)=>{
    if(hidden.has(key)) return null;
    if(!isGroup && hidden.has(SECTOR_META[key]?.g)) return null;
    const data=ALL_YEARS.map(yr=>{
      const raw=getValue(yr,key,isGroup);
      const total=Object.values(DATA[yr]||{}).reduce((a,b)=>a+b.v,0);
      return total?parseFloat((raw/total*100).toFixed(2)):0;
    });
    return {label,data,borderColor:c,backgroundColor:c+'cc',borderWidth:1,
             fill:true,tension:0.35,pointRadius:0,pointHoverRadius:4,
             stack:'mix',type:'line'};
  }).filter(Boolean);
}

// ── annotation + reveal plugin ────────────────────────────────────────────
const revealPlugin={
  id:'reveal',
  beforeDatasetsDraw(chart){
    if(activeTab!=='mix') return;
    const {ctx,chartArea,scales}=chart;
    if(!scales.x||!chartArea) return;
    const px=scales.x.getPixelForValue(playFrame);
    ctx.save();
    ctx.beginPath();
    ctx.rect(chartArea.left,chartArea.top-2,px-chartArea.left+1,chartArea.height+4);
    ctx.clip();
  },
  afterDatasetsDraw(chart){
    if(activeTab!=='mix') return;
    const {ctx,chartArea,scales}=chart;
    if(!scales.x||!chartArea) return;
    ctx.restore();
    const px=scales.x.getPixelForValue(playFrame);
    // dim unrevealed
    ctx.fillStyle='rgba(15,23,42,0.72)';
    ctx.fillRect(px,chartArea.top,chartArea.right-px,chartArea.height);
    // playhead
    ctx.strokeStyle='#e2e8f066';
    ctx.lineWidth=2;
    ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(px,chartArea.top);ctx.lineTo(px,chartArea.bottom);ctx.stroke();
    // year label
    const yr=ALL_YEARS[playFrame];
    ctx.fillStyle='#e2e8f0';
    ctx.font='bold 11px Inter,sans-serif';
    const right=playFrame>ALL_YEARS.length-3;
    ctx.textAlign=right?'right':'left';
    ctx.fillText(yr,px+(right?-6:6),chartArea.top+14);
  },
  afterDraw(chart){
    const {ctx,chartArea,scales}=chart;
    if(!scales.x||!chartArea) return;
    ctx.save();
    ANNOTATIONS.forEach(ann=>{
      const idx=chart.data.labels.indexOf(ann.year);
      if(idx===-1) return;
      const x=scales.x.getPixelForValue(idx);
      const isBreak=ann.type==='break';
      // fade unrevealed annotations if on mix tab
      const revealed=activeTab!=='mix'||idx<=playFrame;
      ctx.globalAlpha=revealed?1:0.3;
      ctx.strokeStyle=isBreak?'#f8717166':'#94a3b844';
      ctx.lineWidth=isBreak?2:1;
      ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=isBreak?'#f87171':'#94a3b8';
      ctx.font='bold 9px Inter,sans-serif';
      ctx.textAlign='center';
      const lx=Math.max(chartArea.left+36,Math.min(chartArea.right-36,x));
      ctx.fillText(ann.label,lx,ann.pos==='top'?chartArea.top+10:chartArea.bottom-5);
      ctx.globalAlpha=1;
    });
    ctx.restore();
  }
};
Chart.register(revealPlugin);

// ── chart ────────────────────────────────────────────────────────────────
const ctx=document.getElementById('main-chart').getContext('2d');
let chart=null;

function buildChart(){
  const years=visYears();
  let datasets,type='bar',stacked=false,yMax=undefined,yLabel='';

  if(activeTab==='abs'){
    type='line'; datasets=lineDatasets(years);
    yLabel=realMode==='real'?'£m (2024/25 prices)':'£m (current prices)';
  } else if(activeTab==='rel'){
    datasets=relDatasets(years); stacked=true; yMax=100;
    yLabel='Share of GVA (%)';
  } else {
    datasets=mixDatasets(); type='line'; stacked=true; yMax=100;
    yLabel='Share of GVA (%)';
  }

  const cfg={
    type,
    data:{labels:activeTab==='mix'?ALL_YEARS:years, datasets},
    options:{
      responsive:true,
      animation:{duration:activeTab==='mix'?0:300},
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#1e293b',borderColor:'#334155',borderWidth:1,
          titleColor:'#e2e8f0',bodyColor:'#94a3b8',footerColor:'#f87171',
          callbacks:{
            label(c){
              const v=c.raw;
              if(v===null||v===undefined) return `${c.dataset.label}: n/a`;
              return activeTab==='abs'
                ?`${c.dataset.label}: £${v.toLocaleString()}m`
                :`${c.dataset.label}: ${v.toFixed(1)}%`;
            },
            footer(items){
              const yr=items[0]?.label;
              const m=DATA[yr]?Object.values(DATA[yr])[0]?.m:'';
              const ext=yr&&yr<'2008/09'&&realMode==='real'?' · deflator: UK CPI proxy':'';
              return m==='pre-ESA10'?`⚠ pre-ESA10 aggregated sectors${ext}`:ext||'';
            }
          }
        }
      },
      scales:{
        x:{stacked,ticks:{color:'#64748b',font:{size:10},maxRotation:45},grid:{color:'#1e293b00'}},
        y:{stacked,min:0,max:yMax,
            title:{display:true,text:yLabel,color:'#64748b',font:{size:10}},
            ticks:{color:'#64748b',font:{size:10},
              callback:v=>activeTab==='abs'?`£${v.toLocaleString()}m`:`${v}%`},
            grid:{color:'#334155'}}
      }
    }
  };
  if(chart) chart.destroy();
  chart=new Chart(ctx,cfg);
}

function renderLegend(){

  items().forEach(({key,label,c})=>{

    div.className='leg-item'+(hidden.has(key)?' off':'');
    div.innerHTML=`<span class="swatch" style="background:${c}"></span><span class="leg-name">${label}</span>`;
    div.onclick=()=>{hidden.has(key)?hidden.delete(key):hidden.add(key);render();};
    el.appendChild(div);
  });
}

  const pre2008=activeTab==='abs'&&realMode==='real'&&ALL_YEARS.indexOf(yrFrom.value)<ALL_YEARS.indexOf('2008/09');
  document.getElementById('note').innerHTML=`

[yrFrom,yrTo].forEach(s=>s.addEventListener('change',()=>{
  if(ALL_YEARS.indexOf(yrFrom.value)>ALL_YEARS.indexOf(yrTo.value)) yrTo.value=yrFrom.value;
  if(ALL_YEARS.indexOf(yrTo.value)<ALL_YEARS.indexOf(yrFrom.value)) yrFrom.value=yrTo.value;
  render();
}));
document.getElementById('show-all').onclick=()=>{hidden.clear();render();};
document.getElementById('hide-all').onclick=()=>{items().forEach(({key})=>hidden.add(key));render();};

// ── play ─────────────────────────────────────────────────────────────────
const playBtn=document.getElementById('play-btn');
const yrBadge=document.getElementById('yr-badge');

function setFrame(i){
  playFrame=Math.max(0,Math.min(i,ALL_YEARS.length-1));
  scrubber.value=playFrame;
  yrBadge.textContent=ALL_YEARS[playFrame];
  if(activeTab==='mix'&&chart){
    chart.update('none');
  }
}
function stopPlay(){
  clearInterval(playTimer);playTimer=null;playing=false;playBtn.textContent='▶ Play';
}
playBtn.addEventListener('click',()=>{
  if(playing){stopPlay();return;}
  if(playFrame>=ALL_YEARS.length-1) setFrame(0);
  playing=true; playBtn.textContent='⏸ Pause';
  playTimer=setInterval(()=>{
    if(playFrame>=ALL_YEARS.length-1){stopPlay();return;}
    setFrame(playFrame+1);
  },SPEEDS[speedIdx]);
});
scrubber.addEventListener('input',()=>{stopPlay();setFrame(parseInt(scrubber.value));});
document.querySelectorAll('[data-spd]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-spd]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); const was=playing; stopPlay();
  speedIdx=parseInt(b.dataset.spd);
  if(was){playing=true;playBtn.textContent='⏸ Pause';
    playTimer=setInterval(()=>{if(playFrame>=ALL_YEARS.length-1){stopPlay();return;}setFrame(playFrame+1);},SPEEDS[speedIdx]);
  }
}));

// ── init ──────────────────────────────────────────────────────────────────
render();
function notifyH(){window.parent.postMessage({type:'resize',height:document.documentElement.scrollHeight},'*');}
new ResizeObserver(notifyH).observe(document.body);
</script>
</body>
